[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
'felupe.view' = ['logo.png']

[tool.ruff]
src = ["src"]
# the published paper is not formatted
extend-exclude = ["paper"]

[tool.ruff.lint]
# an explicit selection of rules, independent of the default rules of ruff
select = [
  "E4",  # imports (pycodestyle)
  "E7",  # statements (pycodestyle)
  "E9",  # runtime and syntax errors (pycodestyle)
  "F",  # pyflakes
  "B006",  # mutable default arguments
  "I",  # sorted imports (isort)
  "W",  # whitespace
]
ignore = [
  "E731",  # lambda assignments, e.g. for short functions in tests and examples
  "E741",  # ambiguous variable names, e.g. `l` (notation of continuum mechanics)
]

[tool.ruff.lint.per-file-ignores]
# the public API is re-exported
"__init__.py" = ["F401"]
# results of calls are bound to variables without being checked
"tests/**" = ["F841"]
# the scripts of sphinx-gallery import modules in later cells
"examples/**" = ["E402"]
"docs/tutorial/examples/**" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests", "src/felupe"]
addopts = ["--doctest-modules", "--import-mode=importlib"]
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]

[project]
name = "felupe"
description = "Open finite element infrastructure for nonlinear computational mechanics. "
readme = "README.md"
authors = [
  {name = "Andreas Dutzler", email = "a.dutzler@gmail.com"},
]
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = [
  "computational-mechanics",
  "fea",
  "fem",
  "finite-elements",
  "finite-elements-analysis",
  "finite-elements-methods",
  "hyperelasticity",
  "infrastructure",
  "open-source",
  "partial-differential-equations",
  "pde",
  "python", 
  "scientific-computing",
  "solid-mechanics-codes",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Utilities"
]
dynamic = ["version"]

dependencies = [
  "numpy",
  "scipy",
]

[project.optional-dependencies]
docs = [
    "sphinx",
    "pydata-sphinx-theme",
    "sphinx-autoapi",
    "sphinx-codeautolink",
    "sphinx-copybutton",
    "sphinx-design",
    "sphinx-gallery",
    "sphinx-inline-tabs",
    "pypandoc",
]
autodiff = ["tensortrax", "jax"]
examples = [
    "contique",
    "imageio",
    "pypardiso",
    "torch",
]
io = [
    "imageio",
    "h5py",
    "meshio",
]
progress = ["tqdm"]
plot = ["matplotlib"]
view = ["pyvista[jupyter]"]
all = ["felupe[autodiff,io,plot,progress,view]"]

[dependency-groups]
read-the-docs = ["felupe[all,docs,examples]"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"

[tool.uv.sources]
setuptools = {index = "pypi"}
torch = {index = "pytorch-cpu"}
torchvision = {index = "pytorch-cpu"}

[tool.setuptools.dynamic]
version = {attr = "felupe.__about__.__version__"}

[project.urls]
Homepage = "https://felupe.readthedocs.io/en/latest"
Documentation = "https://felupe.readthedocs.io/en/latest"
Repository = "https://github.com/adtzlr/felupe"
Issues = "https://github.com/adtzlr/felupe/issues"
Changelog = "https://github.com/adtzlr/felupe/blob/main/CHANGELOG.md"
