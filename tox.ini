[tox]
envlist = core, py3
isolated_build = True

[testenv]
deps =
    pytest
    pytest-cov
extras = all
# the virtual display of the CI (rendering of the plots in the docstring examples)
passenv = DISPLAY
commands =
    pytest tests src/felupe {posargs}

[testenv:core]
commands =
    pytest tests/test_import.py {posargs}
