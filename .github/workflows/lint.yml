name: Lint

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

jobs:
  run:
    name: Lint and check the format with ruff
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Run the pre-commit hooks on all files
      run: |
        pip install pre-commit
        pre-commit run --all-files --show-diff-on-failure
