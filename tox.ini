[tox]
envlist = core, py3
isolated_build = True

[testenv]
deps =
    pytest
    pytest-cov
    pytest-xdist
extras = all
passenv =
    # the virtual display of the CI (rendering of the plots in the docstring examples)
    DISPLAY
    # the persistent compilation cache of JAX, e.g. JAX_COMPILATION_CACHE_DIR
    JAX_*
commands =
    pytest tests src/felupe -n auto --dist worksteal {posargs}

[testenv:core]
# import FElupe with its required dependencies only (numpy, scipy)
deps = pytest
extras =
commands =
    pytest tests/test_import.py
