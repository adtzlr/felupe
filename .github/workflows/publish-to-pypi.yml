name: Publish Python to PyPI

on: push

# read-only by default, only the job "publish" gets an OIDC token
permissions:
  contents: read

jobs:
  build:
    name: Build the distributions
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Setup Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.x'
        architecture: 'x64'
    - name: install pypa/build
      run: >-
        python -m
        pip install
        build
        --user
    - name: build wheel
      run: >-
        python -m
        build
        --sdist
        --wheel
        --outdir dist/
    - name: Store the distributions
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: dist
        path: dist/
        if-no-files-found: error

  publish:
    # a separate job without the build tools, the distributions are uploaded by
    # trusted publishing (OIDC) instead of an API token
    name: Publish the distributions to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/felupe
    permissions:
      id-token: write

    steps:
    - name: Download the distributions
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: dist
        path: dist/
    - name: Publish package to pypi
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
